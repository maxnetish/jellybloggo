basePath: /
definitions:
  auth.ErrorResponse:
    properties:
      code:
        description: |-
          Code is a machine-readable error code for programmatic handling.
          Examples: "VALIDATION_ERROR", "INVALID_JSON"
        type: string
      details:
        description: |-
          Details contains individual field errors when validation fails.
          This is nil for non-validation errors.
        items:
          $ref: '#/definitions/validation.FieldError'
        type: array
      error:
        description: Error is a short description of what went wrong.
        type: string
    type: object
  auth.LoginRequest:
    properties:
      login:
        description: |-
          User login (email or username).
          Required.
        type: string
      password:
        description: |-
          User password.
          Required. Minimum 8 characters.
        type: string
    type: object
  auth.LoginResponse:
    properties:
      access_token:
        type: string
      user:
        $ref: '#/definitions/users.User'
    type: object
  auth.RefreshResponse:
    properties:
      access_token:
        type: string
      user:
        $ref: '#/definitions/users.User'
    type: object
  auth.UserResponse:
    properties:
      user:
        $ref: '#/definitions/users.User'
    type: object
  health.Response:
    properties:
      status:
        type: string
    type: object
  users.Role:
    properties:
      id:
        type: integer
      name:
        type: string
    type: object
  users.User:
    properties:
      created_at:
        type: string
      id:
        type: integer
      login:
        type: string
      roles:
        items:
          $ref: '#/definitions/users.Role'
        type: array
      updated_at:
        type: string
    type: object
  validation.FieldError:
    properties:
      field:
        description: Field is the name of the JSON field that failed validation (e.g.,
          "login", "password").
        type: string
      message:
        description: |-
          Message is a human-readable description of what went wrong.
          This is what should be displayed to the end user.
        type: string
      param:
        description: Param is the parameter for the validation rule (e.g., "8" for
          min=8, "admin" for oneof=admin).
        type: string
      tag:
        description: Tag is the validation rule that failed (e.g., "required", "min",
          "email").
        type: string
      value:
        description: |-
          Value is the actual value that was sent in the request.
          This is useful for debugging, but may be omitted if it's sensitive (like passwords).
        type: string
    type: object
host: localhost:8080
info:
  contact: {}
  description: A lightweight web server backend built with Go
  title: Jellybloggo API
  version: "1.0"
paths:
  /api/auth/login:
    post:
      consumes:
      - application/json
      description: Authenticates user with login and password. Returns access token
        and sets refresh token cookie.
      parameters:
      - description: Login credentials
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/auth.LoginRequest'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/auth.LoginResponse'
        "400":
          description: Invalid request body
          schema:
            $ref: '#/definitions/auth.ErrorResponse'
        "401":
          description: Invalid credentials
          schema:
            $ref: '#/definitions/auth.ErrorResponse'
        "500":
          description: Internal server error
          schema:
            $ref: '#/definitions/auth.ErrorResponse'
      summary: Login user
      tags:
      - auth
  /api/auth/logout:
    post:
      description: Invalidates refresh token and clears cookie.
      responses:
        "204":
          description: No Content
      summary: Logout user
      tags:
      - auth
  /api/auth/refresh:
    post:
      description: Exchanges valid refresh token cookie for new access token. Implements
        token rotation.
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/auth.RefreshResponse'
        "401":
          description: Missing, invalid, or expired refresh token
          schema:
            $ref: '#/definitions/auth.ErrorResponse'
        "500":
          description: Internal server error
          schema:
            $ref: '#/definitions/auth.ErrorResponse'
      summary: Refresh access token
      tags:
      - auth
  /api/auth/user:
    get:
      description: Returns user info if authenticated, or null if not.
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/auth.UserResponse'
      security:
      - BearerAuth: []
      summary: Get current user
      tags:
      - auth
  /health:
    get:
      description: Возвращает статус работоспособности сервера
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/health.Response'
      summary: Health check
      tags:
      - health
securityDefinitions:
  BearerAuth:
    description: Type "Bearer" followed by a space and JWT token.
    in: header
    name: Authorization
    type: apiKey
swagger: "2.0"
