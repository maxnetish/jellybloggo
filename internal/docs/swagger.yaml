basePath: /
definitions:
  auth.ChangePasswordRequest:
    properties:
      current_password:
        description: |-
          Current password for verification.
          Required.
        type: string
      new_password:
        description: |-
          New password.
          Required. Must be at least 8 characters and contain uppercase, lowercase, digit, and special character.
        type: string
    type: object
  auth.ErrorResponse:
    properties:
      code:
        description: |-
          Code is a machine-readable error code for programmatic handling.
          Examples: "VALIDATION_ERROR", "INVALID_JSON"
        type: string
      details:
        description: |-
          Details contains individual field errors when validation fails.
          This is nil for non-validation errors.
        items:
          $ref: '#/definitions/validation.FieldError'
        type: array
      error:
        description: Error is a short description of what went wrong.
        type: string
    type: object
  auth.LoginRequest:
    properties:
      login:
        description: |-
          User login (email or username).
          Required.
        type: string
      password:
        description: |-
          User password.
          Required. Minimum 8 characters.
        type: string
    type: object
  auth.LoginResponse:
    properties:
      access_token:
        type: string
      user:
        $ref: '#/definitions/users.User'
    type: object
  auth.RefreshResponse:
    properties:
      access_token:
        type: string
      user:
        $ref: '#/definitions/users.User'
    type: object
  auth.RegisterRequest:
    properties:
      login:
        description: |-
          User login. Must be unique.
          Required.
        type: string
      password:
        description: |-
          User password.
          Required. Must be at least 8 characters and contain uppercase, lowercase, digit, and special character.
        type: string
    type: object
  auth.UpdateRolesRequest:
    properties:
      login:
        description: |-
          Target user login. Must exist.
          Required.
        type: string
      roles:
        description: |-
          Role names to assign. Each must be one of: admin, author, reader.
          Can be empty to remove all roles.
        items:
          type: string
        type: array
    type: object
  auth.UserResponse:
    properties:
      user:
        $ref: '#/definitions/users.User'
    type: object
  health.Response:
    properties:
      status:
        type: string
    type: object
  users.Role:
    properties:
      id:
        type: integer
      name:
        type: string
    type: object
  users.User:
    properties:
      created_at:
        type: string
      id:
        type: integer
      login:
        type: string
      roles:
        items:
          $ref: '#/definitions/users.Role'
        type: array
      updated_at:
        type: string
    type: object
  validation.FieldError:
    properties:
      field:
        type: string
      message:
        type: string
      tag:
        type: string
      value:
        type: string
    type: object
host: localhost:8080
info:
  contact: {}
  description: A lightweight web server backend built with Go
  title: Jellybloggo API
  version: "1.0"
paths:
  /api/auth/login:
    post:
      consumes:
      - application/json
      description: Authenticates user with login and password. Returns access token
        and sets refresh token cookie.
      parameters:
      - description: Login credentials
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/auth.LoginRequest'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/auth.LoginResponse'
        "400":
          description: Invalid request body
          schema:
            $ref: '#/definitions/auth.ErrorResponse'
        "401":
          description: Invalid credentials
          schema:
            $ref: '#/definitions/auth.ErrorResponse'
        "500":
          description: Internal server error
          schema:
            $ref: '#/definitions/auth.ErrorResponse'
      summary: Login user
      tags:
      - auth
  /api/auth/logout:
    post:
      description: Invalidates refresh token and clears cookie.
      responses:
        "204":
          description: No Content
      summary: Logout user
      tags:
      - auth
  /api/auth/password:
    post:
      consumes:
      - application/json
      description: Changes the password for the current user. Verifies current password
        before updating.
      parameters:
      - description: Current and new password
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/auth.ChangePasswordRequest'
      produces:
      - application/json
      responses:
        "204":
          description: No Content
        "400":
          description: Validation failed
          schema:
            $ref: '#/definitions/auth.ErrorResponse'
        "401":
          description: Current password is incorrect
          schema:
            $ref: '#/definitions/auth.ErrorResponse'
        "500":
          description: Internal server error
          schema:
            $ref: '#/definitions/auth.ErrorResponse'
      security:
      - BearerAuth: []
      summary: Change password
      tags:
      - auth
  /api/auth/refresh:
    post:
      description: Exchanges valid refresh token cookie for new access token. Implements
        token rotation.
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/auth.RefreshResponse'
        "401":
          description: Missing, invalid, or expired refresh token
          schema:
            $ref: '#/definitions/auth.ErrorResponse'
        "500":
          description: Internal server error
          schema:
            $ref: '#/definitions/auth.ErrorResponse'
      summary: Refresh access token
      tags:
      - auth
  /api/auth/register:
    post:
      consumes:
      - application/json
      description: Creates a new user account with the given login and password, then
        returns access token and sets refresh token cookie. New users have no roles.
      parameters:
      - description: Registration credentials
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/auth.RegisterRequest'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/auth.LoginResponse'
        "400":
          description: Validation failed
          schema:
            $ref: '#/definitions/auth.ErrorResponse'
        "409":
          description: Login already taken
          schema:
            $ref: '#/definitions/auth.ErrorResponse'
        "500":
          description: Internal server error
          schema:
            $ref: '#/definitions/auth.ErrorResponse'
      summary: Register a new user
      tags:
      - auth
  /api/auth/roles:
    post:
      consumes:
      - application/json
      description: Changes roles for a target user. Requires admin role. Roles list
        can be empty.
      parameters:
      - description: Target login and roles to assign
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/auth.UpdateRolesRequest'
      produces:
      - application/json
      responses:
        "204":
          description: No Content
        "400":
          description: Invalid login, roles, or target user not found
          schema:
            $ref: '#/definitions/auth.ErrorResponse'
        "401":
          description: Not authenticated
          schema:
            $ref: '#/definitions/auth.ErrorResponse'
        "403":
          description: Admin role required
          schema:
            $ref: '#/definitions/auth.ErrorResponse'
        "500":
          description: Internal server error
          schema:
            $ref: '#/definitions/auth.ErrorResponse'
      security:
      - BearerAuth: []
      summary: Update user roles
      tags:
      - auth
  /api/auth/user:
    get:
      description: Returns user info if authenticated, or null if not.
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/auth.UserResponse'
      security:
      - BearerAuth: []
      summary: Get current user
      tags:
      - auth
  /health:
    get:
      description: Возвращает статус работоспособности сервера
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/health.Response'
      summary: Health check
      tags:
      - health
securityDefinitions:
  BearerAuth:
    description: Type "Bearer" followed by a space and JWT token.
    in: header
    name: Authorization
    type: apiKey
swagger: "2.0"
