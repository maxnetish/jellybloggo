<div tuiPlatform="web" class="login-page">
  <form
    appearance="floating"
    tuiCardLarge
    tuiForm="m"
    [formGroup]="form"
    class="login-card"
    (ngSubmit)="login()"
  >
    <header tuiHeader>
      <h2 tuiTitle>Enter</h2>
    </header>

    <tui-textfield>
      <label tuiLabel>Login</label>
      <input
        formControlName="login"
        placeholder="Enter login"
        tuiInput
        name="login"
      />
    </tui-textfield>
    <tui-error formControlName="login"/>

    <tui-textfield>
      <label tuiLabel>Password</label>
      <input
        placeholder="Enter passord"
        tuiInput
        type="password"
        formControlName="password"
        name="password"
      />
      <tui-icon tuiPassword/>
    </tui-textfield>
    <tui-error formControlName="password"/>

    @if (warn()) {
      <div
        appearance="warning"
        size="m"
        tuiNotification
      >
        {{ warn() }}
      </div>
    }

    <footer>
      <button
        appearance="flat"
        size="m"
        tuiButton
        type="button"
        (click)="register()"
      >
        Register
      </button>
      <button
        appearance="primary"
        size="m"
        tuiButton
        type="submit"
      >
        Login
      </button>
    </footer>
  </form>
</div>
