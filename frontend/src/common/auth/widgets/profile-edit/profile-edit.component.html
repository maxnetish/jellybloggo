<div tuiPlatform="web" class="login-page">
  <form appearance="floating" tuiCardLarge tuiForm="l" [formRoot]="form" class="form">
    <header tuiHeader>
      <h2 tuiTitle>Profile</h2>

      <aside tuiAccessories>
        <div
          [tuiAppearance]="formStatusAppearance()"
          [tuiAvatar]="formStatusIcon()"
          size="s"
        ></div>
      </aside>
    </header>

    <tui-error [error]="formStatusErrorMessage()" />

    <tui-textfield>
      <label tuiLabel>Full name</label>
      <textarea
        placeholder="Optional full name or nickname"
        tuiTextarea
        [formField]="form.fullName"
      ></textarea>
    </tui-textfield>
    <tui-error [formField]="form.fullName" />

    <tui-textfield>
      <label tuiLabel>Date of birth</label>
      <input tuiInputDate [formField]="form.birthDate" />
      <tui-calendar *tuiDropdown />
    </tui-textfield>

    <tui-textfield>
      <label tuiLabel>My location</label>
      <textarea
        placeholder="Where are you? For example, Tatooine"
        tuiTextarea
        [formField]="form.location"
      ></textarea>
    </tui-textfield>
    <tui-error [formField]="form.location" />

    <tui-textfield>
      <label tuiLabel>About me</label>
      <textarea
        placeholder="Public information about me. For example, Jedi knight"
        tuiTextarea
        [formField]="form.about"
      ></textarea>
    </tui-textfield>
    <tui-error [formField]="form.about" />
  </form>
</div>
