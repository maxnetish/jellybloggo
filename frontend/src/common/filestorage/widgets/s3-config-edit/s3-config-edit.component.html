<div tuiPlatform="web">
  <form tuiForm="m" [formRoot]="form" (submit)="submit()">
    <header tuiHeader>
      <h2 tuiTitle>{{ dialogTitle() }}</h2>
    </header>

    @if (serverError()) {
      <div appearance="error" size="m" tuiNotification>
        {{ serverError() }}
      </div>
    }

    <tui-textfield>
      <label tuiLabel>Entry name for user interface</label>
      <input placeholder="Example: Production Minio" tuiInput [formField]="form.config_name" />
    </tui-textfield>
    <tui-error [formField]="form.config_name" />

    <tui-textfield>
      <label tuiLabel>S3 Bucket</label>
      <input placeholder="Example: my-blog-uploads" tuiInput [formField]="form.s3_bucket" />
    </tui-textfield>
    <tui-error [formField]="form.s3_bucket" />

    <tui-textfield>
      <label tuiLabel>Public endpoint</label>
      <input
        placeholder="Example: https://cdn.example.com"
        tuiInput
        [formField]="form.s3_public_end_point"
      />
    </tui-textfield>
    <tui-error [formField]="form.s3_public_end_point" />

    <tui-textfield>
      <label tuiLabel>Access key</label>
      <input
        placeholder="Example: AKIAIOSFODNN7EXAMPLE"
        tuiInput
        [formField]="form.s3_access_key"
      />
      <tui-icon tuiPassword />
    </tui-textfield>
    <tui-error [formField]="form.s3_access_key" />

    <tui-textfield>
      <label tuiLabel>Access secret</label>
      <input
        placeholder="wJalrXUtnFEMI/K7MDENG/bPxRfiCYEXAMPLEKEY"
        tuiInput
        [formField]="form.s3_access_secret"
      />
      <tui-icon tuiPassword />
    </tui-textfield>
    <tui-error [formField]="form.s3_access_secret" />

    <tui-textfield>
      <label tuiLabel>Endpoint</label>
      <input
        placeholder="Example: https://minio.example.com"
        tuiInput
        [formField]="form.s3_endpoint"
      />
    </tui-textfield>
    <tui-error [formField]="form.s3_endpoint" />

    <tui-textfield>
      <label tuiLabel>Region (optional)</label>
      <input placeholder="e.g. us-east-1" tuiInput [formField]="form.s3_region" />
    </tui-textfield>
    <tui-error [formField]="form.s3_region" />

    <footer>
      <button
        appearance="secondary"
        size="m"
        tuiButton
        type="button"
        [disabled]="loading()"
        (click)="cancel()"
      >
        Cancel
      </button>
      <button
        appearance="primary"
        size="m"
        tuiButton
        loading
        type="submit"
        [loading]="loading()"
        [disabled]="loading()"
      >
        OK
      </button>
    </footer>
  </form>
</div>
