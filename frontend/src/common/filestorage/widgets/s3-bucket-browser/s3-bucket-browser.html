<div>
  @if (store.currentPrefix()) {
    <div>
      <button
        type="button"
        tuiButton
        appearance="flat"
        size="s"
        (click)="store.chooseParentPrefix()"
        iconStart="@tui.circle-arrow-up"
      >
        &nldr;
      </button>
    </div>
  }
  @for (entry of store.directories(); track entry.prefix) {
    <div>
      <button
        type="button"
        tuiButton
        appearance="flat"
        size="s"
        (click)="store.choosePrefix(entry.prefix)"
      >
        {{ entry.prefix | funcToPipe : lastSegmentOf }}
      </button>
    </div>
  }
  @for (entry of store.files(); track entry.key) {
    <div>
      {{ entry.key }} - {{ entry.size }}
    </div>
  }
</div>
