<div class="users-page">
  <header class="page-header">
    <h1 class="page-title">Users</h1>
    <span class="total-count">{{ store.total() }} total</span>
  </header>

  <tui-table-pagination
    [items]="pageSizeOptions"
    [page]="store.pageNumber()"
    [size]="store.pageSize()"
    [total]="store.total()"
    (paginationChange)="onPagination($event)"
  />

  <tui-elastic-container class="table-container">
    @if (store.isLoading() && !store.content().length) {
      <tui-loader />
    } @else {
      <table class="users-table" tuiTable>
        <thead>
          <tr>
            <th tuiTh [style.width.rem]="14">Login</th>
            <th tuiTh [style.width.rem]="18">Full name</th>
            <th tuiTh [style.width.rem]="14">Roles</th>
            <th tuiTh [style.width.rem]="12">Created at</th>
            <th tuiTh [style.width.rem]="4"></th>
          </tr>
        </thead>
        <tbody tuiTbody>
          @for (user of store.content(); track user.id) {
            <tr>
              <td class="ellipsis" tuiTd>{{ user.login }}</td>
              <td class="ellipsis" tuiTd>{{ user.full_name || '—' }}</td>
              <td tuiTd>
                <app-user-roles [user]="user" (rolesChange)="onRolesChange(user.login, $event)" />
              </td>
              <td tuiTd>{{ user.created_at | date: 'dd.MM.yyyy' }}</td>
              <td tuiTd>
                <button
                  appearance="flat-destructive"
                  iconStart="@tui.user-x"
                  size="s"
                  tuiIconButton
                  type="button"
                  title="Delete user"
                  (click)="onDelete(user.login)"
                >
                  Delete user
                </button>
              </td>
            </tr>
          } @empty {
            <tr>
              <td [colSpan]="5" tuiTd>No users found</td>
            </tr>
          }
        </tbody>
      </table>
    }
  </tui-elastic-container>

  <tui-table-pagination
    [items]="pageSizeOptions"
    [page]="store.pageNumber()"
    [size]="store.pageSize()"
    [total]="store.total()"
    (paginationChange)="onPagination($event)"
  />
</div>
